<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Work - Map Editor</title>
    <style>
        :root {
            --bg: #1a1a24;
            --panel: #2a2a35;
            --text: #e0e0e0;
            --accent: #4dd0e1;
            --grid: rgba(255,255,255,0.1);
        }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { 
            width: 300px; background: var(--panel); border-right: 1px solid #000; display: flex; flex-direction: column; 
            transition: transform 0.3s ease; position: relative; z-index: 10;
        }
        #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
        
        #toggle-sidebar {
            position: absolute; right: -40px; top: 10px; width: 40px; height: 40px; background: var(--panel);
            color: var(--text); border: none; cursor: pointer; border-radius: 0 5px 5px 0; font-size: 20px;
        }

        .section { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .section h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: var(--accent); }
        
        button, select { 
            background: #3a3a45; color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 5px;
        }
        button:hover, select:hover { background: #4a4a55; }
        button.active { border-color: var(--accent); color: var(--accent); }

        #asset-list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .asset-item { 
            background: rgba(0,0,0,0.5); border: 2px solid transparent; border-radius: 4px; padding: 5px; 
            text-align: center; cursor: pointer; transition: 0.2s;
        }
        .asset-item:hover { border-color: rgba(255,255,255,0.5); }
        .asset-item.selected { border-color: var(--accent); background: rgba(77, 208, 225, 0.2); }
        .asset-item img { max-width: 100%; max-height: 80px; display: block; margin: 0 auto; image-rendering: pixelated; }

        #main-view { flex: 1; position: relative; overflow: auto; background: #000; cursor: crosshair; }
        #canvas-container { position: relative; transform-origin: top left; }
        canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
        
        #controls { position: fixed; bottom: 20px; left: 320px; display: flex; gap: 10px; z-index: 5; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; }
        #controls button { width: auto; padding: 10px 20px; font-weight: bold; }
        #publish-btn { background: #2e7d32; }
        #publish-btn:hover { background: #388e3c; }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="toggle-sidebar">☰</button>
        
        <div class="section">
            <h3>Map</h3>
            <select id="map-select">
                <option value="ritual_stage_1">Ritual Map - Stage 1</option>
                <option value="ritual_stage_2">Ritual Map - Stage 2</option>
                <option value="ritual_stage_3">Ritual Map - Stage 3</option>
                <option value="ritual_stage_4">Ritual Map - Stage 4</option>
                <option value="ritual_stage_5">Ritual Map - Stage 5</option>
                <option value="ritual_stage_6">Ritual Map - Stage 6</option>
                <option value="ritual_stage_7">Ritual Map - Stage 7 (Boss)</option>
            </select>
            <button id="publish-btn">Save / Publish Map</button>
        </div>
        
        <div class="section">
            <h3>Tools</h3>
            <div style="display: flex; gap: 5px;">
                <button id="tool-paint" class="active">Paint</button>
                <button id="tool-erase">Erase</button>
                <button id="tool-select">Select / Move</button>
            </div>
            <p style="font-size: 11px; opacity: 0.7; margin-top: 10px;">Select: Click & drag to move. press Delete to remove. Click & press F to flip horizontally.</p>
        </div>

        <div class="section" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <h3>Assets</h3>
            <input type="text" id="asset-search" placeholder="Search assets..." style="width:100%; padding:5px; margin-bottom:10px; background:#222; color:white; border:1px solid #444; box-sizing:border-box;">
            <div id="asset-list"></div>
        </div>
    </div>

    <div id="main-view">
        <div id="scroll-bounds-wrapper">
            <div id="canvas-container">
                <!-- Layers -->
                <canvas id="bgLayer"></canvas>
                <canvas id="gridLayer"></canvas>
                <canvas id="objectLayer"></canvas>
                <canvas id="uiLayer"></canvas>
            </div>
        </div>
    </div>
    <div id="controls">
        <button onclick="changeZoom(-0.25)">Zoom Out</button>
        <span id="zoom-level" style="padding: 10px; background: rgba(0,0,0,0.5); border-radius: 4px;">100%</span>
        <button onclick="changeZoom(0.25)">Zoom In</button>
    </div>

    <script src="assetList.js"></script>
    <script src="initialMapData.js"></script>
    <script>
        const RITUAL_SPRITES = {
            crystal_wall_front:                { sx: 0,    sy: 0,    sw: 512, sh: 512 },
            crystal_wall_top_view:             { sx: 512,  sy: 0,    sw: 192, sh: 512 },
            crystal_wall_corner_up_left:       { sx: 1024, sy: 0,    sw: 384, sh: 512 },
            crystal_wall_corner_down_left:     { sx: 1536, sy: 0,    sw: 384, sh: 512 },
            crystal_wall_top_front_angle_view: { sx: 0,    sy: 512,  sw: 192, sh: 512 },
            crystal_open_doors:                { sx: 512,  sy: 512,  sw: 512, sh: 512 },
            crystal_closed_doors:              { sx: 1024, sy: 512,  sw: 512, sh: 512 },
            crystal_arch_entrance:             { sx: 1536, sy: 512,  sw: 512, sh: 512 },
            crystal_down_stairs:               { sx: 0,    sy: 1024, sw: 512, sh: 512 }
        };

        // Data Structure matching craft-work game logic
        const MAP_DATA = {};
        for(let i=1; i<=7; i++) {
            MAP_DATA['ritual_stage_' + i] = {
                id: 'ritual_stage_' + i,
                gridSize: 128,
                tilesX: 32,
                tilesY: 32,
                assets: []
            };
        }

        // Editor State
        let currentMapId = 'ritual_stage_1';
        let currentTool = 'paint'; // paint, erase, select
        let selectedAssetObj = null; // The template from the sidebar
        let selectedMapObjects = []; // The instantiated objects on the canvas
        let zoom = 1.0;
        let isDraggingMap = false;
        let isDraggingObj = false;
        let isBoxSelecting = false;
        let selectionBox = { x:0, y:0, w:0, h:0 };
        let startPan = {x:0, y:0};
        let lastPan = {x:0, y:0};
        let objDragOffset = []; // array of offsets per selected object

        // DOM
        const scrollBounds = document.getElementById('scroll-bounds-wrapper');
        const container = document.getElementById('canvas-container');
        const mainView = document.getElementById('main-view');
        const bgCanvas = document.getElementById('bgLayer');
        const gridCanvas = document.getElementById('gridLayer');
        const objCanvas = document.getElementById('objectLayer');
        const uiCanvas = document.getElementById('uiLayer');
        
        const bCtx = bgCanvas.getContext('2d');
        const gCtx = gridCanvas.getContext('2d');
        const oCtx = objCanvas.getContext('2d');
        const uCtx = uiCanvas.getContext('2d');

        // Sprite Cache
        const sprites = {};
        let loadedSpritesCount = 0;

        function initSidebar() {
            document.getElementById('toggle-sidebar').onclick = () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            };

            const mapSelect = document.getElementById('map-select');
            mapSelect.onchange = (e) => {
                currentMapId = e.target.value;
                selectedMapObjects = [];
                setupCanvas(); // resizes and re-draws for the new map
                loadExistingMapData(); // tries to load from HTML for the new map if available
            };

            ['paint', 'erase', 'select'].forEach(t => {
                document.getElementById('tool-' + t).onclick = (e) => {
                    document.querySelectorAll('.section button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTool = t;
                    selectedMapObjects = [];
                    drawMap();
                };
            });

            const assetList = document.getElementById('asset-list');
            const searchInput = document.getElementById('asset-search');

            const renderAssets = (filter = '') => {
                assetList.innerHTML = '';
                
                // 1. Render specific static RITUAL_SPRITES mapped explicitly correctly without stretching
                const mainSheetPath = '../../images/craft-work/indoor maps/stage 1/crystal_structure_sprite_sheet.png';
                const mainSheetImg = sprites[mainSheetPath] || new Image();
                if (!sprites[mainSheetPath]) { mainSheetImg.src = mainSheetPath; sprites[mainSheetPath] = mainSheetImg; }

                Object.keys(RITUAL_SPRITES).forEach(k => {
                    const data = RITUAL_SPRITES[k];
                    if (filter && k.toLowerCase().indexOf(filter) === -1) return;

                    const div = document.createElement('div');
                    div.className = 'asset-item';
                    
                    const cvs = document.createElement('canvas');
                    cvs.width = data.sw;
                    cvs.height = data.sh;
                    cvs.style.width = '100%';
                    cvs.style.display = 'block';
                    cvs.style.imageRendering = 'pixelated';
                    cvs.style.maxHeight = '80px';
                    cvs.style.objectFit = 'contain';

                    const renderCanvas = () => { cvs.getContext('2d').drawImage(mainSheetImg, data.sx, data.sy, data.sw, data.sh, 0, 0, data.sw, data.sh); };
                    if(mainSheetImg.complete && mainSheetImg.naturalWidth > 0) renderCanvas(); else mainSheetImg.addEventListener('load', renderCanvas);

                    div.appendChild(cvs);
                    div.insertAdjacentHTML('beforeend', `<br><span style="font-size:10px; word-wrap:break-word;">${k}</span>`);

                    div.onclick = () => {
                        document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        
                        selectedAssetObj = {
                            type: k,
                            id: k,
                            path: mainSheetPath,
                            sx: data.sx, sy: data.sy, sw: data.sw, sh: data.sh,
                            w: data.sw * 0.5,
                            h: data.sh * 0.5
                        };
                        
                        document.getElementById('tool-paint').click();
                    };
                    assetList.appendChild(div);
                });

                // 2. Render all generically parsed 16-grid sprite sheet blocks from folders!
                AVAILABLE_ASSETS.forEach(assetData => {
                    if (assetData.path.includes('crystal_structure_sprite_sheet')) return; // Skip dupes
                    if (filter && assetData.id.toLowerCase().indexOf(filter) === -1) return;

                    let sw = 512; let sh = 512; let sx = assetData.sx; let sy = assetData.sy;
                    
                    const div = document.createElement('div');
                    div.className = 'asset-item';
                    
                    const sheetImg = sprites[assetData.path] || new Image();
                    if (!sprites[assetData.path]) { sheetImg.src = assetData.path; sprites[assetData.path] = sheetImg; }
                    
                    const cvs = document.createElement('canvas');
                    cvs.width = sw;
                    cvs.height = sh;
                    cvs.style.width = '100%';
                    cvs.style.display = 'block';
                    cvs.style.imageRendering = 'pixelated';
                    cvs.style.maxHeight = '80px';
                    cvs.style.objectFit = 'contain';

                    const renderCanvas = () => { cvs.getContext('2d').drawImage(sheetImg, sx, sy, sw, sh, 0, 0, sw, sh); };
                    if(sheetImg.complete && sheetImg.naturalWidth > 0) renderCanvas(); else sheetImg.addEventListener('load', renderCanvas);

                    div.appendChild(cvs);
                    div.insertAdjacentHTML('beforeend', `<br><span style="font-size:10px; word-wrap:break-word;">${assetData.id}</span>`);

                    div.onclick = () => {
                        document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        
                        // Map editor uses 128 chunks natively. Base assets are 512 -> scaled exactly 0.5 for 2x2 grid.
                        selectedAssetObj = {
                            type: assetData.id,
                            id: assetData.id,
                            path: assetData.path,
                            sx: sx, sy: sy, sw: sw, sh: sh,
                            w: sw * 0.5,
                            h: sh * 0.5
                        };
                        
                        document.getElementById('tool-paint').click();
                    };
                    assetList.appendChild(div);
                });
            };

            renderAssets();
            searchInput.oninput = (e) => renderAssets(e.target.value.toLowerCase());
            
            // Initial load of map
            loadExistingMapData();
        }

        function loadPreloadedAssets() {
            // Need to load unique paths
            const uniquePaths = [...new Set(AVAILABLE_ASSETS.map(a => a.path))];
            uniquePaths.forEach(path => {
                const img = new Image();
                img.src = path;
                sprites[path] = img;
                img.onload = () => {
                    loadedSpritesCount++;
                    if (loadedSpritesCount === uniquePaths.length) {
                        console.log("All sheets loaded.");
                        drawMap();
                    }
                }
            });
        }

        function setupCanvas() {
            const map = MAP_DATA[currentMapId];
            const w = map.tilesX * map.gridSize;
            const h = map.tilesY * map.gridSize;

            [bgCanvas, gridCanvas, objCanvas, uiCanvas].forEach(c => {
                c.width = w;
                c.height = h;
            });
            container.style.width = w + 'px';
            container.style.height = h + 'px';
            
            // Sync bounding tracker wrapper with logical zoom footprint immediately!
            scrollBounds.style.width = (w * zoom) + 'px';
            scrollBounds.style.height = (h * zoom) + 'px';

            drawGrid();
            drawMap();
        }

        function drawGrid() {
            const map = MAP_DATA[currentMapId];
            gCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            gCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            gCtx.lineWidth = 1;

            for (let x = 0; x <= map.tilesX; x++) {
                gCtx.beginPath();
                gCtx.moveTo(x * map.gridSize, 0);
                gCtx.lineTo(x * map.gridSize, gridCanvas.height);
                gCtx.stroke();
            }
            for (let y = 0; y <= map.tilesY; y++) {
                gCtx.beginPath();
                gCtx.moveTo(0, y * map.gridSize);
                gCtx.lineTo(gridCanvas.width, y * map.gridSize);
                gCtx.stroke();
            }
        }

        function drawMap() {
            const map = MAP_DATA[currentMapId];
            oCtx.clearRect(0, 0, objCanvas.width, objCanvas.height);
            uCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            // Sort by Y for depth
            const sortedAssets = [...map.assets].sort((a, b) => a.y - b.y);

            sortedAssets.forEach(item => {
                let sData = RITUAL_SPRITES[item.type];
                
                // If it is a dynamically generated sprite sheet chunk, fetch its cached definition
                const autoSheet = AVAILABLE_ASSETS.find(a => a.id === item.type);
                if (!sData && autoSheet) {
                    sData = { sx: autoSheet.sx, sy: autoSheet.sy, sw: autoSheet.sw, sh: autoSheet.sh, path: autoSheet.path };
                }
                
                const bgImgPath = sData && sData.path ? sData.path : '../../images/craft-work/indoor maps/stage 1/crystal_structure_sprite_sheet.png';
                const img = sprites[bgImgPath];
                
                oCtx.save();
                
                // Navigate pivot anchor to absolute center of object to process rotation or scale inversions natively from epicenter 
                oCtx.translate(item.x + (item.w / 2), item.y + (item.h / 2));
                
                if (item.rot) oCtx.rotate(item.rot * Math.PI / 180);
                if (item.flipX) oCtx.scale(-1, 1);
                
                // Shift anchor back negatively to draw origin so coords map back flawlessly to epicenter transformations
                const drX = -(item.w / 2);
                const drY = -(item.h / 2);
                
                if (sData && img) {
                    oCtx.drawImage(img, sData.sx, sData.sy, sData.sw, sData.sh, drX, drY, item.w, item.h);
                } else if (img) {
                    oCtx.drawImage(img, drX, drY, item.w, item.h);
                } else {
                    oCtx.fillStyle = '#ff00ff'; oCtx.fillRect(drX, drY, item.w, item.h);
                }
                
                oCtx.restore();

                // Selection highlight
                if (currentTool === 'select' && selectedMapObjects.includes(item)) {
                    uCtx.strokeStyle = 'lime';
                    uCtx.lineWidth = 4;
                    uCtx.strokeRect(item.x, item.y, item.w, item.h);
                    
                    // Show dimensions
                    uCtx.fillStyle = 'lime';
                    uCtx.font = '16px sans-serif';
                    uCtx.fillText(`${item.type}`, item.x, item.y - 5);
                }
            });
            
            // Draw box selection visual
            if (currentTool === 'select' && isBoxSelecting) {
                uCtx.fillStyle = 'rgba(77, 208, 225, 0.3)';
                uCtx.fillRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
                uCtx.strokeStyle = 'cyan';
                uCtx.lineWidth = 2;
                uCtx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
            }
        }

        // Interaction processing
        function getCoords(e) {
            const rect = container.getBoundingClientRect();
            // Compensate for mainView scroll dynamically alongside container's zoomed bounding client rect
            const x = (e.clientX - rect.left) / zoom;
            const y = (e.clientY - rect.top) / zoom;
            return { x, y };
        }

        uiCanvas.onmousedown = (e) => {
            const coords = getCoords(e);
            const map = MAP_DATA[currentMapId];

            if (e.button === 1 || (e.button === 2 && currentTool !== 'select')) {
                // Middle click pan (or Right click map dragging without interfering with select tools)
                isDraggingMap = true;
                startPan = { x: e.clientX, y: e.clientY };
                lastPan = { x: mainView.scrollLeft, y: mainView.scrollTop };
                uiCanvas.style.cursor = 'grabbing';
                return;
            }

            if (e.button === 2 && currentTool === 'select') {
                // Right Click Duplicate Selected items
                if (selectedMapObjects.length > 0) {
                    const mappedNew = [];
                    selectedMapObjects.forEach(obj => {
                        const duplicate = { ...obj, id: 'dup_' + Date.now() + Math.random(), x: obj.x + 64, y: obj.y + 64 };
                        map.assets.push(duplicate);
                        mappedNew.push(duplicate);
                    });
                    selectedMapObjects = mappedNew; // move focus to new duplicates
                    drawMap();
                }
                return;
            }

            if (currentTool === 'paint' && selectedAssetObj) {
                // Do not math-round widths because partial pixel clipping is intentionally fractional to strict sprite bounds!
                // Directly use floating literal values mapping 1:1 visually
                let gridW = selectedAssetObj.w;
                let gridH = selectedAssetObj.h;
                
                let gx = Math.floor(coords.x / 64) * 64; // Snap paint placement coordinates to nearest half-grid block 
                let gy = Math.floor(coords.y / 64) * 64;

                // Push to map
                map.assets.push({
                    id: selectedAssetObj.id || selectedAssetObj.type + '_' + Date.now(),
                    type: selectedAssetObj.type,
                    x: gx,
                    y: gy,
                    w: gridW,
                    h: gridH,
                    solid: true,
                    flipX: false
                });
                drawMap();
            } 
            else if (currentTool === 'erase') {
                for (let i = map.assets.length - 1; i >= 0; i--) {
                    const a = map.assets[i];
                    if (coords.x > a.x && coords.x < a.x + a.w && coords.y > a.y && coords.y < a.y + a.h) {
                        map.assets.splice(i, 1);
                        drawMap();
                        break;
                    }
                }
            }
            else if (currentTool === 'select') {
                let clickedOnExisting = false;
                for (let i = map.assets.length - 1; i >= 0; i--) {
                    const a = map.assets[i];
                    if (coords.x > a.x && coords.x < a.x + a.w && coords.y > a.y && coords.y < a.y + a.h) {
                        clickedOnExisting = true;
                        
                        // Check if hitting existing multi-select block
                        if (!selectedMapObjects.includes(a)) {
                            if (!e.shiftKey) { selectedMapObjects = [a]; } 
                            else { selectedMapObjects.push(a); }
                        }
                        
                        isDraggingObj = true;
                        objDragOffset = selectedMapObjects.map(obj => ({ x: coords.x - obj.x, y: coords.y - obj.y, obj: obj }));
                        
                        // Bring picked target to front
                        map.assets.push(map.assets.splice(i, 1)[0]);
                        break;
                    }
                }
                
                if (!clickedOnExisting) {
                    if (!e.shiftKey) selectedMapObjects = [];
                    isBoxSelecting = true;
                    selectionBox = { startX: coords.x, startY: coords.y, x: coords.x, y: coords.y, w: 0, h: 0 };
                }
                drawMap();
            }
        };

        window.onmousemove = (e) => {
            const coords = getCoords(e);
            
            if (isDraggingMap) {
                mainView.scrollLeft = lastPan.x - (e.clientX - startPan.x);
                mainView.scrollTop = lastPan.y - (e.clientY - startPan.y);
            }
            
            if (isBoxSelecting) {
                selectionBox.w = Math.abs(coords.x - selectionBox.startX);
                selectionBox.h = Math.abs(coords.y - selectionBox.startY);
                selectionBox.x = Math.min(coords.x, selectionBox.startX);
                selectionBox.y = Math.min(coords.y, selectionBox.startY);
                drawMap();
            }

            if (isDraggingObj && selectedMapObjects.length > 0) {
                objDragOffset.forEach(dragMap => {
                    const obj = dragMap.obj;
                    let snapX = Math.round((coords.x - dragMap.x) / 64) * 64;
                    let snapY = Math.round((coords.y - dragMap.y) / 64) * 64;
                    obj.x = snapX;
                    obj.y = snapY;
                });
                drawMap();
            }
        };

        window.onmouseup = () => {
            if (isBoxSelecting) {
                const map = MAP_DATA[currentMapId];
                // Select elements inside box
                selectedMapObjects = map.assets.filter(a => {
                    return a.x < selectionBox.x + selectionBox.w && 
                           a.x + a.w > selectionBox.x && 
                           a.y < selectionBox.y + selectionBox.h && 
                           a.y + a.h > selectionBox.y;
                });
            }
            isDraggingMap = false;
            isDraggingObj = false;
            isBoxSelecting = false;
            uiCanvas.style.cursor = 'crosshair';
            drawMap();
        };
        
        // Prevent context menu
        uiCanvas.oncontextmenu = e => e.preventDefault();

        window.onkeydown = (e) => {
            if (currentTool === 'select' && selectedMapObjects.length > 0) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    const map = MAP_DATA[currentMapId];
                    map.assets = map.assets.filter(a => !selectedMapObjects.includes(a));
                    selectedMapObjects = [];
                    drawMap();
                }
                if (e.key === 'f' || e.key === 'F') {
                    selectedMapObjects.forEach(obj => obj.flipX = !obj.flipX);
                    drawMap();
                }
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    selectedMapObjects.forEach(obj => obj.rot = (obj.rot || 0) + 15);
                    drawMap();
                }
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    selectedMapObjects.forEach(obj => obj.rot = (obj.rot || 0) - 15);
                    drawMap();
                }
            }
        };

        function changeZoom(delta) {
            zoom = Math.max(0.25, Math.min(2.0, zoom + delta));
            container.style.transform = `scale(${zoom})`;
            
            // Sync Bounding padding limits explicitly
            const map = MAP_DATA[currentMapId];
            scrollBounds.style.width = (map.tilesX * map.gridSize * zoom) + 'px';
            scrollBounds.style.height = (map.tilesY * map.gridSize * zoom) + 'px';
            
            document.getElementById('zoom-level').innerText = Math.round(zoom * 100) + '%';
        }

        function loadExistingMapData() {
            const map = MAP_DATA[currentMapId];
            if (map.assets.length > 0) return; // Prevent duplicating assets on multiple loads
            
            // Bypass file:/// CORS errors entirely by relying on the auto-generated initialMapData.js file
            if (currentMapId === 'ritual_stage_1' && typeof INITIAL_MAP_DATA !== 'undefined' && INITIAL_MAP_DATA.length > 0) {
                map.assets = INITIAL_MAP_DATA;
                drawMap();
                return;
            }

            // Fallback: Fetch relative to current map editor directory (works for localhost server viewing)
            fetch('../craft-work.html').then(r => r.text()).then(html => {
                if (currentMapId === 'ritual_stage_1') {
                    const regex = /addAsset\('([^']+)',\s*'([^']+)',\s*([\d.]+),\s*([\d.]+),\s*([\d.]+),\s*([\d.]+)/g;
                    let match;
                    while ((match = regex.exec(html)) !== null) {
                        map.assets.push({
                            id: match[1],
                            type: match[2],
                            x: parseFloat(match[3]) * 128,
                            y: parseFloat(match[4]) * 128,
                            w: parseFloat(match[5]) * 128,
                            h: parseFloat(match[6]) * 128,
                            flipX: false
                        });
                    }
                }
                drawMap();
            }).catch(e => {
                console.warn("Could not fetch craft-work.html via network due to file:/// domain policy.", e);
            });
        }

        // Publishing back to root
        document.getElementById('publish-btn').onclick = async () => {
            const map = MAP_DATA[currentMapId];
            
            // Build the string representation for initRitualMap
            let jsStrs = [];
            map.assets.forEach(a => {
                let gridX = a.x / 128;
                let gridY = a.y / 128;
                let w = a.w / 128;
                let h = a.h / 128;
                jsStrs.push(`    addAsset('id_${Math.floor(Math.random()*10000)}', '${a.type}', ${gridX}, ${gridY}, ${w}, ${h}, true);`);
            });
            
            // For now, prompt the script generated directly (Since we don't have express rewriting file access immediately available via frontend fetch)
            const textToCopy = jsStrs.join('\n');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(textToCopy);
            
            try {
                // Ask node server backend to patch the file
                const res = await fetch('/api/save-map', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mapId: currentMapId,
                        layout: textToCopy
                    })
                });
                
                if (res.ok) {
                    alert('Map published successfully to craft-work.html!');
                } else {
                    prompt("Manual Action Required: Copy the layout below and replace the inside of initRitualMap() in craft-work.html:", textToCopy);
                }
            } catch(e) {
                prompt("Run Local Editor saving server or copy layout manually:", textToCopy);
            }
        };

        // Boot
        loadPreloadedAssets();
        setupCanvas();
        initSidebar();

    </script>
</body>
</html>

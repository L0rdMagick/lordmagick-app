<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Work - Debug Menu</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: #111; 
            color: #eee; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { 
            margin-bottom: 20px; 
            color: #ffd700;
            text-shadow: 2px 2px 0px #000;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .category { 
            background: #222; 
            padding: 20px; 
            border-radius: 8px; 
            border: 2px solid #444;
        }
        .category h2 { 
            margin-top: 0; 
            color: #fff; 
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        
        /* Spell Specific Themes */
        .theme-love h2 { color: #ff6b81; }
        .theme-wealth h2 { color: #2ed573; }
        .theme-health h2 { color: #1e90ff; }
        .theme-glamour h2 { color: #a29bfe; }

        button { 
            display: block; width: 100%; padding: 12px; margin-bottom: 8px; 
            background: #333; color: white; border: 1px solid #555; border-radius: 4px; 
            cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s;
        }
        button:hover { 
            background: #555; 
            transform: scale(1.02);
        }
        
        .cauldron-btn { 
            background: #8b0000; 
            border-color: #ff4757;
            margin-top: 20px; 
        }
        .cauldron-btn:hover { 
            background: #a52a2a; 
        }
    </style>
</head>
<body>

<h1>🛠️ Craft Work Debug Menu</h1>
<p style="margin-bottom: 30px; color: #aaa;">Select a stage to jump directly into gameplay. This bypasses the main menu and simulates progress.</p>

<div class="grid">
    <!-- LOVE -->
    <div class="category theme-love">
        <h2>Love Spell</h2>
        <script>
            for(let i=1; i<=7; i++) {
                document.write(`<button onclick="location.href='craft-work.html?spell=love&stage=${i-1}'">Love ${i}</button>`);
            }
        </script>
        <button class="cauldron-btn" onclick="location.href='craft-work.html?spell=love&cauldron=true'">Love Cauldron</button>
    </div>

    <!-- WEALTH -->
    <div class="category theme-wealth">
        <h2>Wealth Spell</h2>
        <script>
            for(let i=1; i<=7; i++) {
                document.write(`<button onclick="location.href='craft-work.html?spell=wealth&stage=${i-1}'">Wealth ${i}</button>`);
            }
        </script>
        <button class="cauldron-btn" onclick="location.href='craft-work.html?spell=wealth&cauldron=true'">Wealth Cauldron</button>
    </div>

    <!-- HEALTH -->
    <div class="category theme-health">
        <h2>Health Spell</h2>
        <script>
            for(let i=1; i<=7; i++) {
                document.write(`<button onclick="location.href='craft-work.html?spell=health&stage=${i-1}'">Health ${i}</button>`);
            }
        </script>
        <button class="cauldron-btn" onclick="location.href='craft-work.html?spell=health&cauldron=true'">Health Cauldron</button>
    </div>

    <!-- GLAMOUR -->
    <div class="category theme-glamour">
        <h2>Glamour Spell</h2>
        <script>
            for(let i=1; i<=7; i++) {
                document.write(`<button onclick="location.href='craft-work.html?spell=glamour&stage=${i-1}'">Glamour ${i}</button>`);
            }
        </script>
        <button class="cauldron-btn" onclick="location.href='craft-work.html?spell=glamour&cauldron=true'">Glamour Cauldron</button>
    </div>
</div>

</body>
</html>
